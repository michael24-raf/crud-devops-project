apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: crud-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: michael1723/crud-frontend:latest # sera remplacé dans workflow
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://backend-service:5000/api"
          # ==================================
          # STARTUP PROBE
          # ==================================
          startupProbe:
            httpGet:
              path: /
              port: 5173
            failureThreshold: 30
            periodSeconds: 10
          # ==================================
          # READINESS PROBE
          # ==================================
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          # ==================================
          # LIVENESS PROBE
          # ==================================
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      restartPolicy: Always
