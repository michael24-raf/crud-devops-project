extends: default

rules:
  line-length:
    max: 120
    level: warning

  indentation:
    spaces: 2
    indent-sequences: false

  document-start: disable

  trailing-spaces:
    level: warning

  new-line-at-end-of-file:
    level: warning

  truthy:
    allowed-values:
      - 'true'
      - 'false'
      - 'on'
      - 'off'
