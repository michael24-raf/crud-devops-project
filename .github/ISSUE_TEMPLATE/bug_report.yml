name: 🐛 Bug Report
description: Signaler un bug
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de remplir ce rapport de bug !

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Une description claire et concise du bug
      placeholder: Le bug se produit quand...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Comment reproduire le problème
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Voir l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce qui devrait se passer
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement actuel
      description: Ce qui se passe réellement
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Composant affecté
      options:
        - Backend
        - Frontend
        - Docker
        - Kubernetes
        - CI/CD
        - Documentation
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Informations sur ton environnement
      value: |
        - OS: [e.g. Ubuntu 22.04]
        - Node.js: [e.g. 20.x]
        - Docker: [e.g. 24.0.0]
        - Navigateur: [e.g. Chrome 120]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logs pertinents
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Contexte additionnel
      description: Toute autre information pertinente