name: Cleanup

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to cleanup'
        required: true
        type: choice
        options:
          - kubernetes
          - docker-images
          - all
      confirm:
        description: 'Type DELETE to confirm'
        required: true

jobs:
  cleanup:
    name: 🧹 Cleanup Resources
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Minikube
        if: github.event.inputs.target == 'kubernetes' || github.event.inputs.target == 'all'
        uses: medyagh/setup-minikube@latest

      - name: 🧹 Cleanup Kubernetes
        if: github.event.inputs.target == 'kubernetes' || github.event.inputs.target == 'all'
        run: |
          echo "🗑️ Deleting all resources in crud-app namespace..."
          kubectl delete all --all -n crud-app
          kubectl delete configmap --all -n crud-app
          kubectl delete secret --all -n crud-app
          kubectl delete pvc --all -n crud-app
          kubectl delete namespace crud-app
          echo "✅ Kubernetes cleanup completed!"

      - name: 🐳 Login to Docker Hub
        if: github.event.inputs.target == 'docker-images' || github.event.inputs.target == 'all'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🧹 Cleanup old Docker images
        if: github.event.inputs.target == 'docker-images' || github.event.inputs.target == 'all'
        run: |
          echo "🗑️ Cleaning up old Docker images..."
          # Keep only the last 5 tags
          # Note: This requires Docker Hub API access
          echo "⚠️ Manual cleanup recommended via Docker Hub UI"
          echo "✅ Docker cleanup instructions displayed!"

      - name: 📊 Cleanup summary
        run: |
          echo "✅ Cleanup completed!"
          echo "Target: ${{ github.event.inputs.target }}"