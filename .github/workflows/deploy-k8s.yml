name: Deploy-Kubernetes

on:
  workflow_dispatch:

env:
  DOCKER_USERNAME: michael1723
  NAMESPACE: crud-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build & Push Backend
        run: |
          docker build -t michael1723/crud-backend:${IMAGE_TAG} .
          docker push michael1723/crud-backend:${IMAGE_TAG}

      - name: 🏗️ Build & Push Frontend
        run: |
          docker build -t michael1723/crud-frontend:${IMAGE_TAG} ./frontend
          docker push michael1723/crud-frontend:${IMAGE_TAG}

  deploy:
    name: 🚀 Deploy to Kubernetes (Minikube)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          cpus: 2
          memory: 4096

      - name: ☸️ Configure kubectl
        run: |
          kubectl cluster-info

      - name: 🚀 Deploy manifests
        run: |
          export IMAGE_TAG=${IMAGE_TAG}

          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/postgres-secret.yaml
          kubectl apply -f k8s/base/postgres-configmap.yaml
          kubectl apply -f k8s/base/backend-configmap.yaml
          kubectl apply -f k8s/base/postgres-pvc.yaml
          kubectl apply -f k8s/base/postgres-deployment.yaml
          kubectl apply -f k8s/base/postgres-service.yaml

          kubectl wait --for=condition=ready pod -l app=postgres -n ${NAMESPACE} --timeout=180s

          envsubst < k8s/base/backend-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/base/backend-service.yaml

          kubectl wait --for=condition=ready pod -l app=backend -n ${NAMESPACE} --timeout=180s

          envsubst < k8s/base/frontend-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/base/frontend-service.yaml

          kubectl wait --for=condition=ready pod -l app=frontend -n ${NAMESPACE} --timeout=180s

      - name: 📊 Verify deployment
        run: |
          kubectl get pods -n ${NAMESPACE}
          kubectl rollout history deployment/backend-deployment -n ${NAMESPACE}
          kubectl rollout history deployment/frontend-deployment -n ${NAMESPACE}
