deploy-k8s:
    - name: ☸️ Deploy to Kubernetes
      runs-on: ubuntu-latest
      needs: [build-backend, build-frontend]
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Minikube
      uses: medyagh/setup-minikube@latest
      with:
        driver: docker
        cpus: 2
        memory: 4096
        kubernetes-version: v1.28.0

    - name: ☸️ Verify Kubernetes cluster
      run: |
        kubectl version --client
        kubectl cluster-info
        kubectl get nodes

    - name: 📝 Replace Docker Hub username in manifests
      run: |
        sed -i "s|michael1723|${{ secrets.DOCKER_USERNAME }}|g" k8s/base/backend-deployment.yaml
        sed -i "s|michael1723|${{ secrets.DOCKER_USERNAME }}|g" k8s/base/frontend-deployment.yaml

    - name: 🗂️ Create namespace
      run: kubectl apply -f k8s/base/namespace.yaml

    - name: 🔐 Create secrets and configmaps
      run: |
        kubectl apply -f k8s/base/postgres-secret.yaml
        kubectl apply -f k8s/base/postgres-configmap.yaml
        kubectl apply -f k8s/base/backend-configmap.yaml

    - name: 💾 Create PVC
      run: kubectl apply -f k8s/base/postgres-pvc.yaml

    - name: 🐘 Deploy PostgreSQL
      run: |
        kubectl apply -f k8s/base/postgres-deployment.yaml
        kubectl apply -f k8s/base/postgres-service.yaml
        echo "⏳ Waiting for PostgreSQL to be ready..."
        kubectl wait --for=condition=ready pod -l app=postgres -n crud-app --timeout=300s

    - name: 🔨 Deploy Backend
      run: |
        kubectl apply -f k8s/base/backend-deployment.yaml
        kubectl apply -f k8s/base/backend-service.yaml
        echo "⏳ Waiting for Backend to be ready..."
        kubectl wait --for=condition=ready pod -l app=backend -n crud-app --timeout=300s

    - name: 🎨 Deploy Frontend
      run: |
        kubectl apply -f k8s/base/frontend-deployment.yaml
        kubectl apply -f k8s/base/frontend-service.yaml
        echo "⏳ Waiting for Frontend to be ready..."
        kubectl wait --for=condition=ready pod -l app=frontend -n crud-app --timeout=300s

    - name: 🔍 Debug Backend Pods
      if: failure()
      run: |
        echo "=== Backend Pods ==="
        kubectl get pods -n crud-app
        kubectl describe pods -l app=backend -n crud-app
        kubectl logs -l app=backend -n crud-app --tail=100

    - name: 🔍 Debug Frontend Pods
      if: failure()
      run: |
        echo "=== Frontend Pods ==="
        kubectl get pods -n crud-app
        kubectl describe pods -l app=frontend -n crud-app
        kubectl logs -l app=frontend -n crud-app --tail=100

    - name: ✅ Verify deployment
      run: |
        echo "==================================="
        echo "📊 Deployment Status"
        echo "==================================="
        kubectl get all -n crud-app
        echo ""
        echo "==================================="
        echo "🔍 Pod Details"
        echo "==================================="
        kubectl get pods -n crud-app -o wide
        echo ""
        echo "==================================="
        echo "📝 Recent Events"
        echo "==================================="
        kubectl get events -n crud-app --sort-by='.lastTimestamp' | tail -10

    - name: 🧪 Health check
      run: |
        echo "Testing backend health endpoint..."
        kubectl port-forward -n crud-app service/backend-service 5000:5000 &
        sleep 10
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
        if [ "$response" -eq 200 ]; then
          echo "✅ Backend health check passed!"
        else
          echo "❌ Backend health check failed with status: $response"
          exit 1
        fi

    - name: 📊 Deployment summary
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "======================================"
        echo "Backend Image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
        echo "Frontend Image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "======================================"
