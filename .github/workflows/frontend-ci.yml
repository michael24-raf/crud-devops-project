name: Frontend-CI

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Lint
        working-directory: ./frontend
        run: npm run lint || echo "Skipping lint"

      - name: 🏗️ Build
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build

      - name: 📏 Check build size
        working-directory: ./frontend
        run: |
          du -sh dist/
          echo "Build completed successfully"

      - name: 🧪 Run tests
        working-directory: ./frontend
        run: npm test

  lighthouse:
    name: 🔍 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api

      - name: 🚀 Serve built files
        working-directory: ./frontend
        run: |
          npm install -g serve
          serve -s dist -l 3000 &
          sleep 5
          curl http://localhost:3000 || exit 1

      - name: 🔍 Run Lighthouse
        run: |
          npm install -g @lhci/cli@0.12.x
          
          lhci autorun \
            --collect.url=http://localhost:3000 \
            --collect.numberOfRuns=1 \
            --collect.settings.chromeFlags="--no-sandbox --headless --disable-gpu" \
            --upload.target=temporary-public-storage || true

      - name: 📊 Lighthouse summary
        if: always()
        run: |
          echo "## 🔍 Lighthouse Audit" >> $GITHUB_STEP_SUMMARY
          echo "Audit completed for frontend build" >> $GITHUB_STEP_SUMMARY