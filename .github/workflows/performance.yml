name: Performance-Test

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration (e.g., 30s, 1m, 5m)'
        required: true
        default: '1m'
      users:
        description: 'Virtual users'
        required: true
        default: '20'
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ==========================================
  # JOB UNIQUE : Setup + Test
  # ==========================================
  performance-test:
    name: ⚡ Backend Performance Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          cpus: 2
          memory: 4096
          kubernetes-version: v1.28.0

      - name: ☸️ Verify Kubernetes
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes

      - name: 📝 Update manifests
        run: |
          sed -i "s|michael24-raf|${{ env.DOCKER_USERNAME }}|g" k8s/base/backend-deployment.yaml
          sed -i "s|michael24-raf|${{ env.DOCKER_USERNAME }}|g" k8s/base/frontend-deployment.yaml

      - name: 🚀 Deploy full application
        run: |
          echo "🗂️ Creating namespace..."
          kubectl apply -f k8s/base/namespace.yaml
          
          echo "🔐 Creating secrets and configmaps..."
          kubectl apply -f k8s/base/postgres-secret.yaml
          kubectl apply -f k8s/base/postgres-configmap.yaml
          kubectl apply -f k8s/base/backend-configmap.yaml
          
          echo "💾 Creating PVC..."
          kubectl apply -f k8s/base/postgres-pvc.yaml
          
          echo "🐘 Deploying PostgreSQL..."
          kubectl apply -f k8s/base/postgres-deployment.yaml
          kubectl apply -f k8s/base/postgres-service.yaml
          
          echo "⏳ Waiting for PostgreSQL..."
          kubectl wait --for=condition=ready pod -l app=postgres -n crud-app --timeout=180s
          
          echo "🔨 Deploying Backend..."
          kubectl apply -f k8s/base/backend-deployment.yaml
          kubectl apply -f k8s/base/backend-service.yaml
          
          echo "⏳ Waiting for Backend..."
          kubectl wait --for=condition=ready pod -l app=backend -n crud-app --timeout=180s
          
          echo "✅ All services deployed!"

      - name: 🔍 Verify deployment
        run: |
          echo "==================================="
          echo "📊 Deployment Status"
          echo "==================================="
          kubectl get all -n crud-app
          kubectl get pods -n crud-app -o wide

      - name: 🌐 Start port-forward in background
        run: |
          echo "Starting port-forward..."
          kubectl port-forward -n crud-app service/backend-service 5000:5000 &
          PORT_FORWARD_PID=$!
          echo "PORT_FORWARD_PID=$PORT_FORWARD_PID" >> $GITHUB_ENV
          
          echo "Waiting for port-forward to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Port-forward ready!"
              break
            fi
            echo "Attempt $i: Waiting for port-forward..."
            sleep 2
          done
          
          # Verify connection
          if ! curl -s http://localhost:5000/health > /dev/null 2>&1; then
            echo "❌ Failed to connect to backend after port-forward"
            kubectl logs -n crud-app -l app=backend --tail=50
            exit 1
          fi

      - name: 🧪 Test backend connectivity
        run: |
          echo "Testing backend health endpoint..."
          response=$(curl -s http://localhost:5000/health)
          echo "Response: $response"
          
          if echo "$response" | grep -q "success"; then
            echo "✅ Backend is responding correctly!"
          else
            echo "❌ Backend is not responding as expected"
            exit 1
          fi

      - name: ⚡ Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: 🧪 Create k6 test script
        run: |
          cat > backend-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          const errorRate = new Rate('errors');

          export const options = {
            stages: [
              { duration: '10s', target: ${{ github.event.inputs.users || 20 }} },
              { duration: '${{ github.event.inputs.duration || '1m' }}', target: ${{ github.event.inputs.users || 20 }} },
              { duration: '10s', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<1000', 'p(99)<2000'],
              http_req_failed: ['rate<0.2'],
              errors: ['rate<0.2'],
            },
          };

          const BASE_URL = 'http://localhost:5000';

          export default function () {
            // Test 1: Health check
            let healthRes = http.get(`${BASE_URL}/health`);
            let healthCheck = check(healthRes, {
              'health check status 200': (r) => r.status === 200,
            });
            if (!healthCheck) errorRate.add(1);

            sleep(1);

            // Test 2: Get all users
            let usersRes = http.get(`${BASE_URL}/api/users`);
            let usersCheck = check(usersRes, {
              'get users status 200': (r) => r.status === 200,
            });
            if (!usersCheck) errorRate.add(1);

            sleep(1);

            // Test 3: Create user (optionnel, peut échouer si DB est readonly)
            const payload = JSON.stringify({
              name: `LoadTest-${Date.now()}-${Math.random()}`,
              email: `loadtest-${Date.now()}-${Math.random()}@example.com`,
              age: Math.floor(Math.random() * 50) + 20,
            });

            const params = {
              headers: {
                'Content-Type': 'application/json',
              },
            };

            let createRes = http.post(`${BASE_URL}/api/users`, payload, params);
            check(createRes, {
              'create user accepted': (r) => r.status === 201 || r.status === 200,
            });

            sleep(2);
          }
          EOF

      - name: 🚀 Run k6 load test
        id: k6_test
        run: |
          echo "Starting k6 load test..."
          k6 run backend-test.js --out json=backend-results.json || true
          
          echo "Load test completed!"

      - name: 📊 Parse and display results
        if: always()
        run: |
          echo "## ⚡ Backend Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Virtual Users: ${{ github.event.inputs.users || 20 }}" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${{ github.event.inputs.duration || '1m' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f backend-results.json ]; then
            echo "**Key Metrics:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            # Extract key metrics
            jq -r '
              select(.type == "Point" and .metric == "http_req_duration") |
              "Request Duration (p95): \(.data.tags.expected_response // "N/A")"
            ' backend-results.json | head -5 >> $GITHUB_STEP_SUMMARY || echo "Metrics extraction partial"
            
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Full results available in artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No results file generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: backend-performance-results
          path: |
            backend-results.json
            k6-*.log
          retention-days: 30

      - name: 🧹 Cleanup port-forward
        if: always()
        run: |
          if [ ! -z "$PORT_FORWARD_PID" ]; then
            kill $PORT_FORWARD_PID || true
          fi

      - name: 📊 Final summary
        if: always()
        run: |
          echo "==================================="
          echo "Performance Test Summary"
          echo "==================================="
          echo "Duration: ${{ github.event.inputs.duration || '1m' }}"
          echo "Virtual Users: ${{ github.event.inputs.users || '20' }}"
          echo "Status: ${{ steps.k6_test.outcome }}"
          echo "==================================="
          
          # Show backend logs
          echo ""
          echo "Backend Logs (last 30 lines):"
          kubectl logs -n crud-app -l app=backend --tail=30